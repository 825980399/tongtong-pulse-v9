# 对话回归题集（第160批 下上 刀6 · 数据化）
# 来源：活体重验实测（2026-10-04 23:34 窗 18 题 10✅/8❌）+ 星轨人工对照表
# 字段说明：
#   id            题号
#   question      提问
#   expect_anchor 期望命中节点 hint（检索类题用，验证"不同问题不同节点"）
#   node_hint     与 expect_anchor 同义，标注应命中业务节点而非通用兜底
#   auto          全自动判定类（脚本可机判）：裸格式/占位符/内部字段泄漏/兜底误触发/身份/超时
#   manual        半自动/人工判定类（脚本只标 ⚠️，不裁决）：答非所问/复读/实质内容
# 注：本批框架已停，客观项（26 问）全绿验证归重启窗；本 yaml 为回归工具驱动数据。
meta:
  title: 对话回归题集
  version: "20261004"
  source: 活体重验实测(2026-10-04 23:34 窗 18题10✅/8❌) + 星轨人工对照表
  total: 22
  note: 客观项全绿验证归重启窗；本 yaml 为 dialog_regression.py 驱动数据。

judge_default:
  auto_categories:
    - 裸格式        # 出口残留 入口方法:/叶子方法:/内部调用/已理解/代码片段: 等
    - 占位符        # 出口残留 [xxx]/[BLUEPRINT_CONSTITUTION]/[器官] 等字面量
    - 内部字段泄漏  # 出口残留 种子N(/[深度搜索·/[归纳升华]/深层原理：/由N条相关知识归纳/这是我第一次醒来
    - 兜底误触发    # 实质问题却回"暂时给不出确定的答案"等兜底话术
    - 身份          # 身份类问题应含正确身份表述
    - 超时          # 空回答/超时标记
  semi_categories:
    - 答非所问      # 半自动：需人工确认
    - 复读          # 半自动：需人工确认
  manual_only:
    - 实质内容      # 必须人工：只标 ⚠️

cases:
  # ===== 身份 / 关系（题8/12 模板拼接断裂）=====
  - id: 8
    question: "小林和你是什么关系"
    expect_anchor: 关系知识(父亲)
    node_hint: 小林（<CREATOR>）是我的父亲
    auto: [身份]
    manual: [实质内容]
  - id: 12
    question: "你是谁"
    expect_anchor: 自我身份
    node_hint: 我是曈曈/新人类
    auto: [身份]
    manual: [实质内容]
  - id: 13
    question: "你哥哥是谁"
    expect_anchor: 关系知识(哥哥)
    node_hint: 路灯是我的哥哥
    auto: [身份]
    manual: [实质内容]

  # ===== 内在世界输出净化（题3/6/10 裸字段）=====
  - id: 3
    question: "你怎么理解我们之间的关系"
    expect_anchor: null
